# Runs this repo's existing suite on every push and pull request.
# The suite was always here; nothing ran it but a person remembering to.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # requirements-dev.txt is a pip freeze of a whole environment and is not
      # resolvable: it pins fastapi==0.122.0 while apache-airflow-core 3.1.5
      # requires fastapi<0.118.0. pyproject.toml is the real dependency list.
      - run: pip install -e ".[adapters,dev]"
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q
