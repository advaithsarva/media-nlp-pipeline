[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-nlp-pipeline"
version = "0.1.0"
description = "Deterministic NLP pipeline with taxonomy classification and scoring"
authors = [
    { name="Advaith Narayana Sarva" }
]
readme = "README.md"
requires-python = ">=3.10"

# Everything the package imports at module level. The previous list named nine
# packages, five of which the code never imports (nltk) or reaches only through
# another (joblib), and left out thirteen it does import -- so `pip install .`
# produced something that could not be imported, and requirements-dev.txt was
# unusable as a substitute: it pins fastapi==0.122.0 against
# apache-airflow-core 3.1.5, which requires fastapi<0.118.0, and pip cannot
# resolve it at all.
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "regex",
    "numpy",
    "scikit-learn",
    "spacy>=3.8",
    "fastapi",
    "uvicorn",
    "pysbd>=0.3.4",          # sentence segmentation
    "networkx>=3.0",         # taxonomy graph
    "transformers>=4.40",    # optional model path in entity_analysis
    "vaderSentiment>=3.3",   # sentiment scoring
    "jsonschema>=4.0",       # output schema validation
    "charset-normalizer>=3.0",
    "beautifulsoup4>=4.12",
    "requests>=2.30",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
# io_adapters/ingest_clients.py imports all four of these at module level, so
# anything that touches the ingest path needs them; nothing else does.
adapters = [
    "elasticsearch>=8.0",
    "boto3>=1.34",
    "kafka-python>=2.0",
    "redis>=5.0",
    "pyarrow>=15.0",         # lazily imported by storage_clients for parquet
]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
